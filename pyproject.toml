[project]
name = "scuola-di-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.130.0",
    "fastembed>=0.8.1",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "mineru[core]>=4.0.6",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pymupdf-layout>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[project.scripts]
kb-extract = "kb.extract:main"
kb-index = "kb.index:main"
kb-eval = "kb.evaluate:main"
kb-search = "kb.search:main"
kb-query = "kb.interactive:main"
kb-hybrid = "kb.hybrid:main"
